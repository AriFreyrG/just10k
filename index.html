<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>just10k</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="map" aria-label="Map"></div>

    <section id="panel" class="panel">
      <!-- 1. Set the goal -->
      <div id="view-setup" class="view">
        <header class="brand"><span class="logo">just10k</span><span class="tag">a new loop, every time</span></header>

        <div class="goal-row">
          <label>
            <span>Daily goal</span>
            <input id="goal" type="number" inputmode="numeric" min="500" step="500" value="10000" />
          </label>
          <label>
            <span>Already walked today</span>
            <input id="done" type="number" inputmode="numeric" min="0" step="100" value="0" />
          </label>
        </div>

        <p class="summary" id="setup-summary"></p>

        <div class="start-row">
          <span class="dot"></span>
          <span id="start-label">Finding your location…</span>
        </div>
        <form id="search-form" class="search">
          <input id="search" type="search" placeholder="Or start from an address…" autocomplete="off" />
        </form>
        <p class="hint">Tip: tap the map to move the start point.</p>

        <details class="settings">
          <summary>Stride settings</summary>
          <label>
            <span>Your height (cm)</span>
            <input id="height" type="number" inputmode="numeric" min="100" max="230" value="170" />
          </label>
          <label>
            <span>Stride length (cm) — overrides height</span>
            <input id="stride" type="number" inputmode="numeric" min="30" max="130" placeholder="auto" />
          </label>
          <p class="hint">Know your real stride? Divide a known distance by your watch's step count for it.</p>
        </details>

        <button id="plan" class="primary" disabled>Plan my walk</button>
        <p class="error" id="setup-error" role="alert"></p>
      </div>

      <!-- 2. Pick a loop -->
      <div id="view-results" class="view" hidden>
        <header class="row-between">
          <button class="link" id="back">‹ Back</button>
          <span class="muted" id="results-target"></span>
        </header>
        <div id="options" class="options" role="radiogroup" aria-label="Route options"></div>
        <div class="actions">
          <button id="shuffle" class="secondary">Shuffle</button>
          <button id="start" class="primary">Start walk</button>
        </div>
        <div class="actions small">
          <a id="gmaps" class="link" target="_blank" rel="noopener">Open in Google Maps</a>
          <button id="gpx" class="link">Download GPX</button>
          <button id="simulate" class="link" hidden>Simulate walk</button>
        </div>
      </div>

      <!-- 3. Walking -->
      <div id="view-walk" class="view" hidden>
        <div id="offroute" class="banner" hidden>
          <span>You're off the route.</span>
          <button id="replan" class="secondary">Re-plan the rest</button>
        </div>
        <div class="instruction">
          <div id="next-text">Head out</div>
          <div id="next-dist" class="muted"></div>
        </div>
        <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
        <div class="stats">
          <div><strong id="walked-steps">0</strong><span>steps this walk</span></div>
          <div><strong id="total-steps">0</strong><span>today (est.)</span></div>
          <div><strong id="remaining">0</strong><span>km to go</span></div>
        </div>
        <button id="end" class="secondary wide">End walk</button>
      </div>

      <!-- 4. Done -->
      <div id="view-done" class="view" hidden>
        <h2>🎉 Done!</h2>
        <p id="done-summary"></p>
        <button id="again" class="primary wide">Plan another</button>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin=""></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
